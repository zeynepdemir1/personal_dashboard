<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hatice Zeynep Demir – Portfolyo</title>
<meta name="description" content="Hatice Zeynep Demir – Mekatronik Mühendisliği öğrencisi. Projeler, deneyim ve beceriler.">
<meta name="theme-color" content="#1A1316">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="/portfolio/style.css">
</head>
<body>
<div class="page">

<header class="site">
  <div class="wrap site-in">
    <span class="brand">Hatice Zeynep DEMİR</span>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <div class="tools">
      <div class="langs" role="group" aria-label="Language / Dil">
        <button type="button" class="lang" id="lang-tr" aria-pressed="true">TR</button>
        <button type="button" class="lang" id="lang-en" aria-pressed="false">EN</button>
      </div>
      <a class="pill pill-sm" href="#contact" data-i18n="navCta"></a>
    </div>
  </div>
</header>

<main>
<section class="hero">
  <canvas class="hero-canvas" id="hero-canvas" aria-hidden="true"></canvas>
  <div class="wrap hero-in">
    <div class="hero-text">
      <span class="eyebrow rv d1" data-i18n="role"></span>
      <h1 class="h1 rv d2">Hatice<br>Zeynep<br>Demir.</h1>
      <p class="intro rv d3" data-i18n="intro"></p>
      <div class="cta rv d4">
        <a class="pill" href="mailto:hzeynepdemirr@gmail.com" data-i18n="emailBtn"></a>
        <a class="textlink" href="https://github.com/zeynepdemir1">GitHub →</a>
      </div>
    </div>
    <div class="shapebar" id="shapebar" role="group">
      <span class="shapelabel" data-i18n="shapeLabel"></span>
    </div>
  </div>
</section>

<section id="projects" class="wrap section">
  <div class="sec-head">
    <span class="sec-num">01</span>
    <h2 data-i18n="s1"></h2>
    <span class="sec-hint" data-i18n="hint1"></span>
  </div>
  <div class="proj-layout">
    <div class="tabs" id="tabs" role="group"></div>
    <article class="card">
      <div class="card-head">
        <h3 id="card-title"></h3>
        <span class="card-id" id="card-id"></span>
      </div>
      <dl class="rows" id="card-rows"></dl>
      <div class="links" id="card-links"></div>
    </article>
  </div>
</section>

<section id="experience" class="wrap section">
  <div class="sec-head">
    <span class="sec-num">02</span>
    <h2 data-i18n="s2"></h2>
    <span class="sec-hint" data-i18n="hint2"></span>
  </div>
  <div class="joblist" id="jobs"></div>
</section>

<section id="skills" class="wrap section">
  <div class="sec-head">
    <span class="sec-num">03</span>
    <h2 data-i18n="s3"></h2>
    <span class="sec-hint" data-i18n="hint3"></span>
  </div>
  <div class="skills-layout">
    <div class="groups" id="groups"></div>
    <aside class="spec" aria-live="polite">
      <div class="spec-bar"><span data-i18n="specLabel"></span><span class="badge" id="spec-badge"></span></div>
      <div class="spec-body">
        <div class="spec-name" id="spec-name"></div>
        <p class="spec-text" id="spec-text"></p>
      </div>
    </aside>
  </div>
</section>
</main>

<footer id="contact" class="foot">
  <div class="wrap foot-in">
    <div class="foot-text">
      <span class="foot-label" data-i18n="s4label"></span>
      <h2 data-i18n="contactTitle"></h2>
      <p data-i18n="contactText"></p>
    </div>
    <div class="foot-links">
      <a class="ul foot-mail" href="mailto:hzeynepdemirr@gmail.com">hzeynepdemirr@gmail.com</a>
      <a class="ul foot-gh" href="https://github.com/zeynepdemir1">github.com/zeynepdemir1</a>
    </div>
  </div>
</footer>

<noscript>
  <div class="wrap noscript">Hatice Zeynep Demir · Mekatronik Mühendisliği · hzeynepdemirr@gmail.com · github.com/zeynepdemir1</div>
</noscript>
</div>
<script src="/portfolio/app.js"></script>
</body>
</html>
